version : "3.9"
services:
  db : 
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: mydb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass

    volumes : 
      - db_data:/var/lib/mysql
    ports : 
      - "3306:3306"
  
  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: mysql
      DB_USER: appuser
      DB_PASSWORD: apppass
      DB_PORT: 3306
    ports:
      - 5000:5000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
